<!DOCTYPE htm1>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예시1 - 레이아웃을 div로 나누기</title>
    <style>
        *{ box-sizing: border-box; }
        body {font-family: sans-sans-serif; margin: 0;}

        /*각 div 영역에 배경색을 다르게 줘서 눈으로 확인 */
        .header { background: #4a90e2; color: white; padding: 20px; text-align: center; }
        .nav    {background: #333; padding: 10px; }
        .nav a  {color: white; margin: 0 15px; text-decoration: none;}
        .container { display: flex; }
        .main   {background: #f4f4f4; padding: 20px; flex: 3; }
        .sideber{background: #dcdcdc; padding: 20px; flex: 1; }
        .footer {background: #333; color: white; text-align: center; padding: 10px }
    </style>
</head>
<body>

    <!--1. 헤더영역-->
    <div class="header">
        <h1>내 웹사이트</h1>
    </div>

    <!--2. 네비게이션 영역-->
    <div class="nav">
        <a href="#">연락처</a>
    </div>

    <!--3. 본문 + 사이드바를 감싸는 큰 div -->
    <div class="container">

        <!--3-1.본문 영역-->
        <div class="main">
            <d2>본문 내용</d2>
            <p>공지, 광고, 링크 목록 등</p>
        <div>


    </div>

    <!--4. 푸터 영역 -->
    <div class="footer">
        <p>%copy; 2026 내 웹사이트</p>
    </div>
</body>
</tml>
