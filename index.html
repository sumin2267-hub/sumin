<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자바스크립트 기능 실습</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      line-height: 1.6;
    }
    .box {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    #text_message {
      cursor: pointer;
      font-weight: bold;
      display: inline-block;
      padding: 5px;
    }
  </style>
</head>
<body>

  <!-- 1. 로그인 폼 -->
  <div class="box">
    <h2>1. 로그인</h2>
    <form id="loginForm">
      <input type="text" id="user_Id" placeholder="아이디" required>
      <input type="password" id="user_Pw" placeholder="비밀번호" required>
      <button type="submit">로그인</button>
    </form>
  </div>

  <!-- 2. 카운터 -->
  <div class="box">
    <h2>2. 클릭 카운터</h2>
    <button id="counter">클릭하세요!</button>
    <p id="count_number">0번 클릭</p>
  </div>

  <!-- 3. 색상 변경 -->
  <div class="box">
    <h2>3. 텍스트 색상 변경</h2>
    <p id="text_message">이 텍스트를 클릭하면 무작위 색상으로 변경됩니다!</p>
  </div>

  <script>
    // 회원 정보 설정
    const id = "junamsu";
    const pw = "helloworld";

    // 1. 로그인 기능
    const loginForm = document.querySelector("#loginForm");
    loginForm.onsubmit = function (e) {
      e.preventDefault(); // 페이지 새로고침 방지

      const inputId = document.querySelector("#user_Id").value;
      const inputPw = document.querySelector("#user_Pw").value;

      if (inputId === id && inputPw === pw) {
        alert("로그인 성공!");
      } else {
        alert("로그인 실패: 아이디 또는 비밀번호가 틀렸습니다.");
      }
    };

    // 2. 카운터 기능
    let counter = document.querySelector("#counter");
    let number = 0;
    let count_number = document.querySelector("#count_number");
    
    counter.onclick = function () {
      number = number + 1;
      count_number.textContent = number + "번 클릭";
    };

    // 3. 색 바꾸기 기능
    let text_message = document.querySelector('#text_message');
    text_message.onclick = function () {
      const r = Math.floor(Math.random() * 256);
      const g = Math.floor(Math.random() * 256);
      const b = Math.floor(Math.random() * 256);
      text_message.style.color = 'rgb(' + r + ',' + g + ',' + b + ')';
    };
  </script>
</body>
</html>
