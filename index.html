<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOBBY ON - 20대를 위한 취미 추천 서비스</title>
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #6C5CE7;
      --primary-light: #A29BFE;
      --primary-soft: #EEEDFD;
      --accent-yellow: #FFE17D;
      --accent-red: #FF7675;
      --bg-main: #F4F6FB;
      --bg-card: #FFFFFF;
      --text-dark: #2D3436;
      --text-gray: #636E72;
      --text-light: #B2BEC3;
      --border-color: #E2E8F0;
      --shadow: 0 10px 25px -5px rgba(108, 92, 231, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0.8rem 1.5rem;
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--primary);
      cursor: pointer;
    }

    .logo-badge {
      background: var(--primary);
      color: white;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .header-nav {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .header-nav a {
      text-decoration: none;
      color: var(--text-gray);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .header-nav a.active {
      color: var(--primary);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      padding: 0.4rem 1rem;
      width: 200px;
    }

    .search-bar input {
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      font-size: 0.9rem;
    }

    .search-bar button {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
    }

    .login-nav-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Container */
    .app-container {
      max-width: 1280px;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
      display: flex;
      gap: 1.5rem;
      flex: 1;
      width: 100%;
    }

    /* Sidebar */
    aside {
      width: 220px;
      flex-shrink: 0;
    }

    .sidebar-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 1.2rem;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .sidebar-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 1rem;
      padding-left: 0.5rem;
    }

    .category-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .category-btn {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-gray);
      cursor: pointer;
      text-align: left;
    }

    .category-btn.active {
      background: var(--primary);
      color: white;
    }

    /* Main Section */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      min-width: 0;
    }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, #A29BFE 0%, #6C5CE7 100%);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      color: white;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .banner-badge {
      display: inline-block;
      background: var(--accent-yellow);
      color: #2D3436;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .hero-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
    }

    .tag-filters {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .tag-btn {
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .tag-btn.active {
      background: white;
      color: var(--primary);
      border-color: white;
    }

    /* Section Header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

      border: 1px solid var(--border-color);
      background: white;
      padding: 0.4rem 0.8rem;
      border
