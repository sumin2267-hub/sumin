<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOBBY ON - 취미 찾기</title>
  <!-- FontAwesome (아이콘 라이브러리) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Noto Sans KR) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 상단 헤더 / 검색바 -->
  <header class="header">
    <div class="logo">HOBBY ON</div>
    <div class="search-bar">
      <input type="text" placeholder="취미 찾기, 인기취미 추천...">
      <button type="button" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
  </header>

  <div class="container">
    <!-- 좌측 카테고리 사이드바 -->
    <aside class="sidebar">
      <h2 class="sidebar-title">카테고리</h2>
      <nav class="category-list">
        <a href="#home" class="category-item active"><i class="fa-solid fa-house"></i> 홈</a>
        <a href="#popular" class="category-item"><i class="fa-solid fa-fire"></i> 인기</a>
        <a href="#recommend" class="category-item"><i class="fa-solid fa-wand-magic-sparkles"></i> 추천</a>
        <a href="#craft" class="category-item"><i class="fa-solid fa-palette"></i> 만들기</a>
        <a href="#sports" class="category-item"><i class="fa-solid fa-person-running"></i> 운동</a>
        <a href="#music" class="category-item"><i class="fa-solid fa-music"></i> 음악</a>
        <a href="#reading" class="category-item"><i class="fa-solid fa-book-open"></i> 독서</a>
      </nav>
    </aside>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-content">
      <!-- 타이틀 메인 히어로 세션 -->
      <section class="hero-section">
        <h1 class="hero-title">오늘은 어떤 취미를 해볼까요?</h1>
      </section>

      <!-- 필터 태그 버튼 -->
      <section class="filter-section">
        <button class="filter-btn purple">혼자</button>
        <button class="filter-btn yellow">친구</button>
        <button class="filter-btn red">집에서</button>
        <button class="filter-btn green">밖에서</button>
      </section>

      <!-- 인기 취미 섹션 -->
      <section class="popular-section">
        <div class="section-title">
          <i class="fa-solid fa-fire popular-icon"></i>
          <span>인기취미</span>
        </div>
        
        <div class="hobby-cards">
          <div class="card">
            <div class="card-icon"><i class="fa-solid fa-palette"></i></div>
            <p class="card-text">만들기</p>
          </div>
          <div class="card">
            <div class="card-icon"><i class="fa-solid fa-cake-candles"></i></div>
            <p class="card-text">베이킹</p>
          </div>
          <div class="card">
            <div class="card-icon"><i class="fa-solid fa-camera"></i></div>
            <p class="card-text">사진 촬영</p>
          </div>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
